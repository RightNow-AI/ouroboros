# Ouroboros Configuration — Qwen2.5-0.5B based (~200M params)
# Smaller base model for faster proof-of-concept

vocab_size: 151936
base_model: "Qwen/Qwen2.5-0.5B"
n_base_layers: 24

core_block:
  d_model: 896
  n_heads: 14
  n_kv_heads: 2
  d_ff: 4864
  head_dim: 64
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  max_seq_len: 2048
  dropout: 0.0
  qkv_bias: true

lora:
  rank: 8
  alpha: 16.0

controller:
  state_proj_dim: 256
  step_embed_dim: 128
  halt_proj_dim: 16
  style_dim: 32
  style_hidden_dim: 512
  n_basis: 8
  max_steps: 128
  bottleneck_divisor: 16

halter:
  hidden_dim: 128
  halt_bias_init: -2.0
  act_loss_weight: 0.01

training:
  max_recursion_steps: 64
  max_seq_len: 2048
  batch_size_per_gpu: 8
  gradient_accumulation_steps: 8
  num_gpus: 4
  seed: 42

  # Phase 1: Recover Knowledge (extended overnight)
  phase1_steps: 60000
  phase1_fixed_depth: 8
  phase1_lr: 3.0e-4
  phase1_min_lr: 1.0e-6
  phase1_warmup_steps: 2000

  # Phase 2: Awaken Controller (extended overnight)
  phase2_steps: 40000
  phase2_depths: [4, 8, 16, 32]
  phase2_lr: 1.0e-4
  phase2_min_lr: 1.0e-6
  phase2_warmup_steps: 1000
  phase2_distill_alpha: 0.5
  phase2_distill_temp: 2.0
  phase2_teacher_model: "Qwen/Qwen2.5-72B-Instruct"

  # Phase 3: Full Ouroboros (extended overnight)
  phase3_steps: 60000
  phase3_lr: 3.0e-5
  phase3_min_lr: 1.0e-6
  phase3_warmup_steps: 1000
  phase3_act_loss_weight: 0.01

  # Optimization
  weight_decay: 0.1
  max_grad_norm: 1.0
  bf16: true

  # Logging
  log_every: 10
  eval_every: 500
  save_every: 2000
  checkpoint_dir: "checkpoints_qwen"
  wandb_project: "ouroboros"
